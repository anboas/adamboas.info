name: sync-whitepaper

on:
  workflow_dispatch:
  schedule:
    # keep it fresh without needing cross-repo auth plumbing
    - cron: '17 * * * *'

permissions:
  contents: write
  actions: write

concurrency:
  group: sync-whitepaper
  cancel-in-progress: true

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install unzip
        run: |
          sudo apt-get update
          sudo apt-get install -y unzip

      - name: Fetch Plausible pageview counts (optional)
        env:
          PLAUSIBLE_API_KEY: ${{ secrets.PLAUSIBLE_API_KEY }}
          PLAUSIBLE_SITE_ID: ${{ secrets.PLAUSIBLE_SITE_ID }}
          PLAUSIBLE_DATE_RANGE: 30d
        run: node scripts/fetch-plausible-pageviews.mjs

      - name: Fetch Plausible lead-funnel events (optional)
        env:
          PLAUSIBLE_API_KEY: ${{ secrets.PLAUSIBLE_API_KEY }}
          PLAUSIBLE_SITE_ID: ${{ secrets.PLAUSIBLE_SITE_ID }}
          PLAUSIBLE_DATE_RANGE: 30d
        run: node scripts/fetch-plausible-funnel.mjs

      - name: Fetch latest successful Whitepaper build run id
        env:
          # NOTE: Cross-repo API access requires a PAT if Whitepaper is private.
          # Create a fine-grained PAT with access to anboas/Whitepaper (Actions: Read) and store it as WHITEPAPER_SYNC_TOKEN.
          GH_TOKEN: ${{ secrets.WHITEPAPER_SYNC_TOKEN }}
        run: |
          set -euo pipefail

          if [ -z "${GH_TOKEN:-}" ]; then
            echo "Missing required secret WHITEPAPER_SYNC_TOKEN (needed for cross-repo access)." >&2
            exit 1
          fi

          RUN_ID=$(gh api \
            -H "Accept: application/vnd.github+json" \
            "/repos/anboas/Whitepaper/actions/workflows/build-papers.yml/runs?branch=main&status=success&per_page=1" \
            --jq '.workflow_runs[0].id')

          if [ -z "$RUN_ID" ] || [ "$RUN_ID" = "null" ]; then
            echo "No successful runs found" >&2
            exit 1
          fi

          echo "RUN_ID=$RUN_ID" >> $GITHUB_ENV
          echo "Using Whitepaper run $RUN_ID"

      - name: Fetch latest successful Whitepaper memo run id
        env:
          GH_TOKEN: ${{ secrets.WHITEPAPER_SYNC_TOKEN }}
        run: |
          set -euo pipefail

          MEMO_RUN_ID=$(gh api \
            -H "Accept: application/vnd.github+json" \
            "/repos/anboas/Whitepaper/actions/workflows/build-memos.yml/runs?branch=main&status=success&per_page=1" \
            --jq '.workflow_runs[0].id')

          if [ -z "$MEMO_RUN_ID" ] || [ "$MEMO_RUN_ID" = "null" ]; then
            echo "No successful memo runs found" >&2
            exit 1
          fi

          echo "MEMO_RUN_ID=$MEMO_RUN_ID" >> $GITHUB_ENV
          echo "Using Whitepaper memo run $MEMO_RUN_ID"

      - name: Download Whitepaper paper artifacts
        env:
          GH_TOKEN: ${{ secrets.WHITEPAPER_SYNC_TOKEN }}
        run: |
          set -euo pipefail
          mkdir -p /tmp/wp
          cd /tmp/wp
          gh run download "$RUN_ID" -R anboas/Whitepaper
          ls -la

      - name: Download Whitepaper memo artifacts
        env:
          GH_TOKEN: ${{ secrets.WHITEPAPER_SYNC_TOKEN }}
        run: |
          set -euo pipefail
          mkdir -p /tmp/wm
          cd /tmp/wm
          gh run download "$MEMO_RUN_ID" -R anboas/Whitepaper
          ls -la

      - name: Sync PDFs + HTML into this repo
        run: |
          set -euo pipefail

          mkdir -p public/papers
          mkdir -p src/generated/papers

          # Publish toggle: only sync papers that are marked status: published in src/content/papers/*.md.
          # This lets us build everything in Whitepaper CI, but only publish a curated set to the site.
          allowed_slugs=()
          shopt -s nullglob
          for f in src/content/papers/*.md; do
            slug=$(basename "$f" .md)
            status=$(awk 'BEGIN{s=0} /^---\s*$/{s++; next} s==1{print} s>1{exit}' "$f" | awk -F: '$1 ~ /^status\s*$/ {gsub(/^[ \t]+|[ \t]+$/, "", $2); print $2; exit}')
            if [ "$status" = "published" ]; then
              allowed_slugs+=("$slug")
            fi
          done

          is_allowed() {
            local x="$1"
            for s in "${allowed_slugs[@]}"; do
              if [ "$s" = "$x" ]; then return 0; fi
            done
            return 1
          }

          echo "Allowed (published) paper slugs: ${allowed_slugs[*]:-<none>}"

          # Start clean so unpublishing propagates.
          rm -f public/papers/*.pdf
          rm -f src/generated/papers/*.html src/generated/papers/*.raw.html src/generated/papers/*.manifest.json

          # Each downloaded artifact becomes a directory named after artifact name
          for d in /tmp/wp/paper-*; do
            [ -d "$d" ] || continue
            slug=${d##*/paper-}

            if ! is_allowed "$slug"; then
              echo "Skipping (not published): $slug"
              continue
            fi

            echo "Syncing (published): $slug"

            pdf=$(ls -1 "$d"/*.pdf 2>/dev/null | head -n 1 || true)
            manifest=$(ls -1 "$d"/manifest.json 2>/dev/null | head -n 1 || true)
            # Prefer pre-extracted fragment HTML if present.
            html=$(ls -1 "$d"/paper.html 2>/dev/null | head -n 1 || true)
            if [ -z "$html" ]; then
              html=$(ls -1 "$d"/*.html 2>/dev/null | head -n 1 || true)
            fi

            if [ -n "$pdf" ]; then
              cp "$pdf" "public/papers/${slug}.pdf"
            else
              echo "WARN: no pdf for $slug" >&2
            fi

            if [ -n "$html" ]; then
              # Save the raw fragment exactly as produced by Whitepaper so we can
              # verify integrity against the upstream manifest, then normalize into
              # the final site fragment.
              cp "$html" "src/generated/papers/${slug}.raw.html"

              # Normalize styles + tables for the site.
              python3 scripts/extract_pandoc_body.py "src/generated/papers/${slug}.raw.html" "src/generated/papers/${slug}.html"
            else
              echo "WARN: no html for $slug" >&2
            fi

            if [ -n "$manifest" ]; then
              cp "$manifest" "src/generated/papers/${slug}.manifest.json"
            else
              echo "WARN: no manifest for $slug" >&2
            fi
          done

      - name: Sync notes + memos from Whitepaper repo
        env:
          GH_TOKEN: ${{ secrets.WHITEPAPER_SYNC_TOKEN }}
        run: |
          set -euo pipefail

          rm -rf /tmp/wp-repo

          # Avoid `gh repo clone` (GraphQL) since fine-grained PATs can fail with:
          # "Resource not accessible by personal access token (repository.defaultBranchRef)".
          #
          # NOTE: This requires the PAT to have repo **Contents: Read** access.
          # If clone fails (403), we skip syncing notes/memos so paper sync can still succeed.
          if ! git clone --depth 1 "https://x-access-token:${GH_TOKEN}@github.com/anboas/Whitepaper.git" /tmp/wp-repo; then
            echo "WARN: Could not clone anboas/Whitepaper for notes/memos sync. Ensure WHITEPAPER_SYNC_TOKEN has Contents: Read." >&2
            exit 0
          fi

          # Sync paper diagrams (rendered outputs are committed in Whitepaper under papers/<slug>/diagrams).
          # Publish them at: public/papers/<slug>/diagrams/* so generated HTML img src="/papers/<slug>/diagrams/..." resolves.
          mkdir -p public/papers
          # Clear any existing diagrams so deletions in Whitepaper propagate.
          find public/papers -mindepth 2 -maxdepth 2 -type d -name diagrams -print0 2>/dev/null | xargs -0 -r rm -rf

          # Publish toggle for diagrams: only publish diagrams for papers that are status: published on the site.
          allowed_slugs=()
          shopt -s nullglob
          for f in src/content/papers/*.md; do
            slug=$(basename "$f" .md)
            status=$(awk 'BEGIN{s=0} /^---\s*$/{s++; next} s==1{print} s>1{exit}' "$f" | awk -F: '$1 ~ /^status\s*$/ {gsub(/^[ \t]+|[ \t]+$/, "", $2); print $2; exit}')
            if [ "$status" = "published" ]; then
              allowed_slugs+=("$slug")
            fi
          done

          is_allowed() {
            local x="$1"
            for s in "${allowed_slugs[@]}"; do
              if [ "$s" = "$x" ]; then return 0; fi
            done
            return 1
          }

          for d in /tmp/wp-repo/papers/*; do
            slug=$(basename "$d")
            if ! is_allowed "$slug"; then
              continue
            fi
            if [ -d "$d/diagrams" ]; then
              mkdir -p "public/papers/${slug}/diagrams"
              cp -f "$d/diagrams"/* "public/papers/${slug}/diagrams/" || true
            fi
          done

          # Snapshot current published note stems before sync so we can detect accidental drops.
          previous_published_note_stems=()
          shopt -s nullglob
          for f in src/content/writing/notes/*.md; do
            base=$(basename "$f")
            [ "$base" = "README.md" ] && continue
            if awk 'BEGIN{s=0} /^---[[:space:]]*$/{s++; next} s==1{print} s>1{exit}' "$f" | grep -Eq '^status:[[:space:]]*draft[[:space:]]*$'; then
              continue
            fi
            previous_published_note_stems+=("${base%.md}")
          done

          # Start clean so deletions in Whitepaper propagate.
          rm -rf src/content/writing
          mkdir -p src/content/writing/notes src/content/writing/memos

          # Memo artifacts are synced from Whitepaper build-memos outputs.
          rm -rf public/memos src/generated/memos
          mkdir -p public/memos src/generated/memos

          # Copy published notes + memos markdown (ignore README.md). Preserve folders to avoid slug collisions.
          # status frontmatter defaults to published when omitted.
          shopt -s globstar nullglob

          frontmatter_value() {
            local file="$1"
            local key="$2"
            awk 'BEGIN{s=0} /^---[[:space:]]*$/{s++; next} s==1{print} s>1{exit}' "$file" \
              | awk -F: -v k="$key" '$1 ~ ("^"k"[[:space:]]*$") {sub(/^[^:]*:[[:space:]]*/, "", $0); gsub(/^[ \t]+|[ \t]+$/, "", $0); gsub(/^"|"$/, "", $0); gsub(/^\047|\047$/, "", $0); print $0; exit}'
          }

          frontmatter_status() {
            local file="$1"
            local s
            s=$(frontmatter_value "$file" status || true)
            if [ -z "$s" ]; then
              echo "published"
            else
              echo "$s"
            fi
          }

          in_list() {
            local needle="$1"
            shift
            for item in "$@"; do
              if [ "$item" = "$needle" ]; then
                return 0
              fi
            done
            return 1
          }

          published_memo_stems=()

          for f in /tmp/wp-repo/writing/notes/**/*.md; do
            base=$(basename "$f")
            if [ "$base" = "README.md" ]; then
              continue
            fi
            status=$(frontmatter_status "$f")
            if [ "$status" != "published" ]; then
              echo "Skipping note (status=$status): $base"
              continue
            fi
            cp "$f" "src/content/writing/notes/${base}"
          done

          for f in /tmp/wp-repo/writing/memos/**/*.md; do
            base=$(basename "$f")
            if [ "$base" = "README.md" ]; then
              continue
            fi
            status=$(frontmatter_status "$f")
            if [ "$status" != "published" ]; then
              echo "Skipping memo (status=$status): $base"
              continue
            fi
            cp "$f" "src/content/writing/memos/${base}"
            published_memo_stems+=("${base%.md}")
          done

          # Guardrail: fail when previously published notes disappear after sync unless explicitly allowed.
          missing_published_notes=()
          for slug in "${previous_published_note_stems[@]}"; do
            if [ ! -f "src/content/writing/notes/${slug}.md" ]; then
              missing_published_notes+=("$slug")
            fi
          done
          if [ ${#missing_published_notes[@]} -gt 0 ]; then
            echo "Published notes missing after sync: ${missing_published_notes[*]}" >&2
            mkdir -p tmp/sync
            printf "%s
" "${missing_published_notes[@]}" > tmp/sync/missing-published-notes.txt
            if [ "${SYNC_ALLOW_REMOVED_NOTES:-false}" != "true" ]; then
              echo "Set SYNC_ALLOW_REMOVED_NOTES=true to allow intentional removals." >&2
              exit 1
            fi
          fi

          missing_memo_artifacts=0

          # Copy generated memo artifacts (PDF + HTML + manifest) for published memos only.
          for d in /tmp/wm/memo-*; do
            [ -d "$d" ] || continue
            slug=${d##*/memo-}

            if ! in_list "$slug" "${published_memo_stems[@]}"; then
              echo "Skipping memo artifacts (not published): $slug"
              continue
            fi

            pdf="$d/memo.pdf"
            html="$d/memo.html"
            manifest="$d/manifest.json"

            if [ ! -f "$pdf" ] || [ ! -f "$html" ] || [ ! -f "$manifest" ]; then
              echo "ERROR: missing memo artifacts for published memo: $slug" >&2
              missing_memo_artifacts=1
              continue
            fi

            cp "$pdf" "public/memos/${slug}.pdf"
            cp "$html" "src/generated/memos/${slug}.raw.html"
            cp "$html" "src/generated/memos/${slug}.html"
            cp "$manifest" "src/generated/memos/${slug}.manifest.json"
          done

          # Ensure every published memo has artifact outputs.
          for slug in "${published_memo_stems[@]}"; do
            if [ ! -f "public/memos/${slug}.pdf" ] || [ ! -f "src/generated/memos/${slug}.html" ] || [ ! -f "src/generated/memos/${slug}.manifest.json" ]; then
              echo "ERROR: published memo missing synced artifacts: $slug" >&2
              missing_memo_artifacts=1
            fi
          done

          if [ "$missing_memo_artifacts" -ne 0 ]; then
            echo "Memo artifact sync failed" >&2
            exit 1
          fi

      - name: Upload sync diagnostics (optional)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sync-whitepaper-diagnostics
          path: tmp/sync
          if-no-files-found: ignore

      - name: Commit changes
        id: commit
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          # Include new (untracked) files too.
          git add -A public/papers public/memos src/generated/papers src/generated/memos src/content/writing src/generated/plausible-pageviews.json src/generated/plausible-funnel.json

          if [ -z "$(git status --porcelain)" ]; then
            echo "No changes to commit."
            echo "changed=false" >> $GITHUB_OUTPUT
            exit 0
          fi

          git commit -m "Sync Whitepaper outputs (PDF + HTML)"
          git push
          echo "changed=true" >> $GITHUB_OUTPUT

      - name: Trigger Pages deploy
        if: steps.commit.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh workflow run deploy-dev-pages --repo anboas/adamboas.info
