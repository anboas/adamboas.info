name: sync-whitepaper

on:
  workflow_dispatch:
  schedule:
    # keep it fresh without needing cross-repo auth plumbing
    - cron: '17 * * * *'

permissions:
  contents: write
  actions: write

concurrency:
  group: sync-whitepaper
  cancel-in-progress: true

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install unzip
        run: |
          sudo apt-get update
          sudo apt-get install -y unzip

      - name: Fetch latest successful Whitepaper build run id
        env:
          # NOTE: Cross-repo API access requires a PAT if Whitepaper is private.
          # Create a fine-grained PAT with access to anboas/Whitepaper (Actions: Read) and store it as WHITEPAPER_SYNC_TOKEN.
          GH_TOKEN: ${{ secrets.WHITEPAPER_SYNC_TOKEN }}
        run: |
          set -euo pipefail

          if [ -z "${GH_TOKEN:-}" ]; then
            echo "Missing required secret WHITEPAPER_SYNC_TOKEN (needed for cross-repo access)." >&2
            exit 1
          fi

          RUN_ID=$(gh api \
            -H "Accept: application/vnd.github+json" \
            "/repos/anboas/Whitepaper/actions/workflows/build-papers.yml/runs?branch=main&status=success&per_page=1" \
            --jq '.workflow_runs[0].id')

          if [ -z "$RUN_ID" ] || [ "$RUN_ID" = "null" ]; then
            echo "No successful runs found" >&2
            exit 1
          fi

          echo "RUN_ID=$RUN_ID" >> $GITHUB_ENV
          echo "Using Whitepaper run $RUN_ID"

      - name: Download Whitepaper artifacts
        env:
          GH_TOKEN: ${{ secrets.WHITEPAPER_SYNC_TOKEN }}
        run: |
          set -euo pipefail
          mkdir -p /tmp/wp
          cd /tmp/wp
          gh run download "$RUN_ID" -R anboas/Whitepaper
          ls -la

      - name: Sync PDFs + HTML into this repo
        run: |
          set -euo pipefail

          mkdir -p public/papers
          mkdir -p src/generated/papers

          shopt -s nullglob

          # Each downloaded artifact becomes a directory named after artifact name
          for d in /tmp/wp/paper-*; do
            [ -d "$d" ] || continue
            slug=${d##*/paper-}
            echo "Syncing $slug"

            pdf=$(ls -1 "$d"/*.pdf 2>/dev/null | head -n 1 || true)
            html=$(ls -1 "$d"/*.html 2>/dev/null | head -n 1 || true)

            if [ -n "$pdf" ]; then
              cp "$pdf" "public/papers/${slug}.pdf"
            else
              echo "WARN: no pdf for $slug" >&2
            fi

            if [ -n "$html" ]; then
              # Pandoc HTML is standalone with its own <style>. Extract body-only fragment.
              python3 scripts/extract_pandoc_body.py "$html" "src/generated/papers/${slug}.html"
            else
              echo "WARN: no html for $slug" >&2
            fi
          done

      - name: Sync notes + memos from Whitepaper repo
        env:
          GH_TOKEN: ${{ secrets.WHITEPAPER_SYNC_TOKEN }}
        run: |
          set -euo pipefail

          rm -rf /tmp/wp-repo
          gh repo clone anboas/Whitepaper /tmp/wp-repo -- --depth 1

          mkdir -p src/content/writing

          # Start clean so deletions in Whitepaper propagate.
          rm -rf src/content/writing
          mkdir -p src/content/writing

          # Copy all notes + memos markdown (ignore README.md). Flat output is fine for now.
          shopt -s globstar nullglob
          for f in /tmp/wp-repo/writing/notes/**/*.md /tmp/wp-repo/writing/memos/**/*.md; do
            base=$(basename "$f")
            if [ "$base" = "README.md" ]; then
              continue
            fi
            cp "$f" "src/content/writing/${base}"
          done

      - name: Commit changes
        id: commit
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          # Include new (untracked) files too.
          git add -A public/papers src/generated/papers src/content/writing

          if [ -z "$(git status --porcelain)" ]; then
            echo "No changes to commit."
            echo "changed=false" >> $GITHUB_OUTPUT
            exit 0
          fi

          git commit -m "Sync Whitepaper outputs (PDF + HTML)"
          git push
          echo "changed=true" >> $GITHUB_OUTPUT

      - name: Trigger Pages deploy
        if: steps.commit.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh workflow run deploy-dev-pages --repo anboas/adamboas.info
