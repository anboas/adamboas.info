name: build-site

on:
  push:
    branches: [ main ]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install deps
        run: npm ci

      - name: Lint content frontmatter
        run: npm run lint:content

      - name: Verify paper artifacts (PDF + generated HTML)
        run: npm run lint:papers

      - name: Build
        run: npm run build

      - name: Upload static site artifact
        uses: actions/upload-artifact@v4
        with:
          name: site-dist
          path: dist
