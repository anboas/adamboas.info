name: build-site

on:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install deps
        run: npm ci

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      - name: Lint content frontmatter
        run: npm run lint:content

      - name: Verify paper artifacts (PDF + generated HTML)
        run: npm run lint:papers

      - name: Verify memo artifacts (PDF + generated HTML)
        run: npm run lint:memos

      - name: Build
        run: npm run build

      - name: Regression test suite (smoke + overflow + a11y)
        run: |
          set -euo pipefail
          npm run preview -- --host 127.0.0.1 --port 4321 >/tmp/astro-preview.log 2>&1 &
          PREVIEW_PID=$!
          trap 'kill ${PREVIEW_PID} >/dev/null 2>&1 || true' EXIT

          for _ in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:4321/ >/dev/null; then
              break
            fi
            sleep 1
          done

          SITE_BASE=http://127.0.0.1:4321 npx playwright test tests/smoke.spec.ts tests/overflow.spec.ts tests/a11y.spec.ts tests/opportunities-events-regression.spec.ts tests/writing-regression.spec.ts

      - name: Prepare linkcheck policy sets (strict/warn/ignore)
        run: npm run linkcheck:prepare

      - name: Link check (strict domains, blocking)
        uses: lycheeverse/lychee-action@v2
        with:
          lycheeVersion: v0.22.0
          args: >-
            --verbose
            --no-progress
            --accept 200,202,206,401,403,429
            --timeout 20
            --max-retries 2
            "tmp/linkcheck/strict-links.txt"
          output: tmp/linkcheck/strict-results.md

      - name: Link check (warn-only domains, non-blocking)
        if: always()
        run: npm run linkcheck:warn

      - name: Stale-link remediation suggestions
        if: always()
        run: npm run linkcheck:suggest

      - name: Upload linkcheck artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: linkcheck-artifacts
          path: tmp/linkcheck

      - name: Upload Playwright test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-results
          path: |
            test-results
            playwright-report

      - name: Upload static site artifact
        uses: actions/upload-artifact@v4
        with:
          name: site-dist
          path: dist
