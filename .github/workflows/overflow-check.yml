name: overflow-check

on:
  schedule:
    - cron: '47 12 * * *' # daily
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          filter: blob:none
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /*
            !/src/data/radar/mirror/sam-opportunities/notice-desc-cache/
            !/src/data/radar/mirror/sam-opportunities/notices/
            !/src/data/radar/mirror/sam-opportunities/queries/
            !/src/data/radar/mirror/sam-opportunities/resources/blobs/
            !/src/data/radar/mirror/sam-opportunities/runs/
            !/src/data/radar/mirror/sam-opportunities/snapshots/

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install deps
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Run overflow regression (mobile)
        run: npm run test:overflow

      - name: Notify Telegram on failure (optional)
        if: failure()
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          if [ -z "${TELEGRAM_BOT_TOKEN:-}" ] || [ -z "${TELEGRAM_CHAT_ID:-}" ]; then
            echo "Telegram secrets not set; skipping notify."
            exit 0
          fi
          text="[ALERT] overflow regression failed: ${RUN_URL}"
          curl -sS -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            -d "chat_id=${TELEGRAM_CHAT_ID}" \
            -d "text=${text}" \
            -d "disable_web_page_preview=true" >/dev/null
