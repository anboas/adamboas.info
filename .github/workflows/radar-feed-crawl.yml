name: radar-feed-crawl

on:
  workflow_dispatch:
  schedule:
    # Daily at 09:20 ET / 14:20 UTC (adjusts with DST as UTC)
    - cron: '20 14 * * *'

permissions:
  contents: read

jobs:
  crawl:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Run feed registry crawl
        run: python3 scripts/crawl-radar-feed-registry.py

      - name: Upload crawl artifacts
        uses: actions/upload-artifact@v7
        with:
          name: radar-feed-crawl-report
          path: |
            src/data/radar/feed-crawl-report-latest.json
            src/data/radar/feed-crawl-report-latest.md
