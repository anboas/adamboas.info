name: workflow-lint

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/**'
  pull_request:
    paths:
      - '.github/workflows/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  actionlint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          filter: blob:none
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /*
            !/src/data/radar/mirror/sam-opportunities/notice-desc-cache/
            !/src/data/radar/mirror/sam-opportunities/notices/
            !/src/data/radar/mirror/sam-opportunities/queries/
            !/src/data/radar/mirror/sam-opportunities/resources/blobs/
            !/src/data/radar/mirror/sam-opportunities/runs/
            !/src/data/radar/mirror/sam-opportunities/snapshots/
      - uses: rhysd/actionlint@v1.7.8
