name: linkcheck

on:
  push:
    branches: [ main ]
  pull_request:
  schedule:
    - cron: '33 6 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install deps
        run: npm ci

      - name: Lint content frontmatter
        run: npm run lint:content

      - name: Verify paper artifacts (PDF + generated HTML)
        run: npm run lint:papers

      - name: Build
        run: npm run build

      - name: Prepare linkcheck policy sets (strict/warn/ignore)
        run: npm run linkcheck:prepare

      - name: Link check (strict domains, blocking)
        uses: lycheeverse/lychee-action@v2
        with:
          lycheeVersion: v0.22.0
          args: >-
            --verbose
            --no-progress
            --accept 200,206,401,403,429
            --timeout 20
            --max-retries 2
            "tmp/linkcheck/strict-links.txt"

      - name: Link check (warn-only domains, non-blocking)
        if: always()
        run: npm run linkcheck:warn

      - name: Stale-link remediation suggestions
        if: always()
        run: npm run linkcheck:suggest

      - name: Upload linkcheck artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: linkcheck-artifacts
          path: tmp/linkcheck

      - name: Notify Telegram on failure (optional)
        if: failure()
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          if [ -z "${TELEGRAM_BOT_TOKEN:-}" ] || [ -z "${TELEGRAM_CHAT_ID:-}" ]; then
            echo "Telegram secrets not set; skipping notify."
            exit 0
          fi
          text="[ALERT] linkcheck failed: ${RUN_URL}"
          curl -sS -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            -d "chat_id=${TELEGRAM_CHAT_ID}" \
            -d "text=${text}" \
            -d "disable_web_page_preview=true" >/dev/null
