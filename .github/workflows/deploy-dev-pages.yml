name: deploy-dev-pages

on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - '!src/generated/plausible-pageviews.json'
      - '!src/generated/plausible-funnel.json'
      - 'public/**'
      - 'scripts/**'
      - 'package.json'
      - 'package-lock.json'
      - 'astro.config.mjs'
      - 'tsconfig.json'
      - '.github/workflows/deploy-dev-pages.yml'
  schedule:
    # Keep public 30-day chips reasonably fresh without committing analytics churn.
    - cron: '47 * * * *'
  workflow_run:
    workflows: [radar-feed-crawl, opportunities-drift-report]
    types: [completed]
  workflow_dispatch:

permissions:
  actions: read
  contents: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          filter: blob:none
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /*
            !/src/data/radar/mirror/sam-opportunities/notice-desc-cache/
            !/src/data/radar/mirror/sam-opportunities/notices/
            !/src/data/radar/mirror/sam-opportunities/queries/
            !/src/data/radar/mirror/sam-opportunities/resources/blobs/
            !/src/data/radar/mirror/sam-opportunities/runs/
            !/src/data/radar/mirror/sam-opportunities/snapshots/

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install deps
        run: npm ci

      - name: Hydrate latest public pipeline snapshots
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          hydrate_snapshot() {
            workflow="$1"
            artifact="$2"
            shift 2

            run_id="$(gh run list \
              --repo "${GITHUB_REPOSITORY}" \
              --workflow "${workflow}" \
              --status success \
              --limit 1 \
              --json databaseId \
              --jq '.[0].databaseId')"

            if [ -z "${run_id}" ] || [ "${run_id}" = "null" ]; then
              echo "No successful ${workflow} run found; retaining repository snapshot."
              return
            fi

            snapshot_dir="$(mktemp -d)"
            gh run download "${run_id}" \
              --repo "${GITHUB_REPOSITORY}" \
              --name "${artifact}" \
              --dir "${snapshot_dir}"

            for filename in "$@"; do
              cp "${snapshot_dir}/${filename}" "src/data/radar/${filename}"
            done
          }

          hydrate_snapshot \
            radar-feed-crawl.yml \
            radar-feed-crawl-report \
            feed-crawl-report-latest.json \
            feed-crawl-report-latest.md

          hydrate_snapshot \
            opportunities-drift-report.yml \
            opportunities-drift-report \
            events-candidates-sam-opportunities-drift-latest.json \
            events-candidates-sam-opportunities-drift-latest.md \
            events-candidates-sam-opportunities-drift-snapshot.json

      - name: Fetch Plausible pageview counts
        env:
          PLAUSIBLE_API_KEY: ${{ secrets.PLAUSIBLE_API_KEY }}
          PLAUSIBLE_SITE_ID: ${{ secrets.PLAUSIBLE_SITE_ID }}
          PLAUSIBLE_DATE_RANGE: 30d
        run: node scripts/fetch-plausible-pageviews.mjs

      - name: Fetch Plausible sitemap analytics
        env:
          PLAUSIBLE_API_KEY: ${{ secrets.PLAUSIBLE_API_KEY }}
          PLAUSIBLE_SITE_ID: ${{ secrets.PLAUSIBLE_SITE_ID }}
          PLAUSIBLE_DATE_RANGE: 30d
        run: node scripts/fetch-plausible-sitemap-analytics.mjs

      - name: Fetch Plausible lead-funnel events (optional; manual deploys only)
        if: github.event_name == 'workflow_dispatch'
        env:
          PLAUSIBLE_API_KEY: ${{ secrets.PLAUSIBLE_API_KEY }}
          PLAUSIBLE_SITE_ID: ${{ secrets.PLAUSIBLE_SITE_ID }}
          PLAUSIBLE_DATE_RANGE: 30d
        run: node scripts/fetch-plausible-funnel.mjs

      - name: Build (custom domain root)
        env:
          ASTRO_BASE: /
          PUBLIC_MEDIA_BASE_URL: ${{ vars.PUBLIC_MEDIA_BASE_URL }}
        run: npm run build

      - name: Quick deploy smoke check (manual deploys only)
        if: github.event_name == 'workflow_dispatch'
        run: |
          set -euo pipefail
          npm run preview -- --host 127.0.0.1 --port 4321 >/tmp/astro-preview.log 2>&1 &
          PREVIEW_PID=$!
          trap 'kill ${PREVIEW_PID} >/dev/null 2>&1 || true' EXIT

          for _ in $(seq 1 45); do
            if curl -fsS http://127.0.0.1:4321/ >/dev/null; then
              break
            fi
            sleep 1
          done

          curl -fsS http://127.0.0.1:4321/ >/dev/null
          curl -fsS http://127.0.0.1:4321/writing/ >/dev/null
          curl -fsS http://127.0.0.1:4321/events/ >/dev/null

      - name: Trim deploy artifact when external media base is configured
        env:
          PUBLIC_MEDIA_BASE_URL: ${{ vars.PUBLIC_MEDIA_BASE_URL }}
        run: |
          set -euo pipefail
          if [ -n "${PUBLIC_MEDIA_BASE_URL:-}" ]; then
            echo "External media base detected: ${PUBLIC_MEDIA_BASE_URL}"
            echo "Removing dist/audio from Pages artifact to speed deploy"
            rm -rf dist/audio
          else
            echo "PUBLIC_MEDIA_BASE_URL not set; keeping dist/audio in artifact"
          fi

      - name: Deploy to gh-pages branch
        run: |
          set -euo pipefail

          deploy_dir="$(mktemp -d)"

          git fetch origin gh-pages --depth=1
          git worktree add "$deploy_dir" FETCH_HEAD

          rsync -a --delete --exclude .git dist/ "$deploy_dir/"

          cd "$deploy_dir"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add -A
          if [ -z "$(git status --porcelain)" ]; then
            echo "No gh-pages changes to deploy."
            exit 0
          fi

          git commit -m "Deploy site"
          git push origin HEAD:gh-pages

      - name: Notify Telegram on success/failure (optional)
        if: always()
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          RESULT: ${{ job.status }}
          PAGE_URL: https://www.adamboas.com/
        run: |
          set -euo pipefail
          if [ -z "${TELEGRAM_BOT_TOKEN:-}" ] || [ -z "${TELEGRAM_CHAT_ID:-}" ]; then
            echo "Telegram secrets not set; skipping notify."
            exit 0
          fi

          if [ "${RESULT}" = "success" ]; then
            text="[OK] deploy-dev-pages succeeded: ${PAGE_URL}\n${RUN_URL}"
          else
            text="[ALERT] deploy-dev-pages ${RESULT}: ${RUN_URL}"
          fi

          curl -sS -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            -d "chat_id=${TELEGRAM_CHAT_ID}" \
            -d "text=${text}" \
            -d "disable_web_page_preview=true" >/dev/null
