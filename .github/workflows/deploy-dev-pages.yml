name: deploy-dev-pages

on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - '!src/generated/plausible-pageviews.json'
      - '!src/generated/plausible-funnel.json'
      - 'public/**'
      - 'scripts/**'
      - 'package.json'
      - 'package-lock.json'
      - 'astro.config.mjs'
      - 'tsconfig.json'
      - '.github/workflows/deploy-dev-pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install deps
        run: npm ci

      - name: Fetch Plausible pageview counts (optional; manual deploys only)
        if: github.event_name == 'workflow_dispatch'
        env:
          PLAUSIBLE_API_KEY: ${{ secrets.PLAUSIBLE_API_KEY }}
          PLAUSIBLE_SITE_ID: ${{ secrets.PLAUSIBLE_SITE_ID }}
          PLAUSIBLE_DATE_RANGE: 30d
        run: node scripts/fetch-plausible-pageviews.mjs

      - name: Fetch Plausible lead-funnel events (optional; manual deploys only)
        if: github.event_name == 'workflow_dispatch'
        env:
          PLAUSIBLE_API_KEY: ${{ secrets.PLAUSIBLE_API_KEY }}
          PLAUSIBLE_SITE_ID: ${{ secrets.PLAUSIBLE_SITE_ID }}
          PLAUSIBLE_DATE_RANGE: 30d
        run: node scripts/fetch-plausible-funnel.mjs

      - name: Build (custom domain root)
        env:
          ASTRO_BASE: /
          PUBLIC_MEDIA_BASE_URL: ${{ vars.PUBLIC_MEDIA_BASE_URL }}
        run: npm run build

      - name: Quick deploy smoke check (manual deploys only)
        if: github.event_name == 'workflow_dispatch'
        run: |
          set -euo pipefail
          npm run preview -- --host 127.0.0.1 --port 4321 >/tmp/astro-preview.log 2>&1 &
          PREVIEW_PID=$!
          trap 'kill ${PREVIEW_PID} >/dev/null 2>&1 || true' EXIT

          for _ in $(seq 1 45); do
            if curl -fsS http://127.0.0.1:4321/ >/dev/null; then
              break
            fi
            sleep 1
          done

          curl -fsS http://127.0.0.1:4321/ >/dev/null
          curl -fsS http://127.0.0.1:4321/writing/ >/dev/null
          curl -fsS http://127.0.0.1:4321/events/ >/dev/null

      - name: Trim deploy artifact when external media base is configured
        env:
          PUBLIC_MEDIA_BASE_URL: ${{ vars.PUBLIC_MEDIA_BASE_URL }}
        run: |
          set -euo pipefail
          if [ -n "${PUBLIC_MEDIA_BASE_URL:-}" ]; then
            echo "External media base detected: ${PUBLIC_MEDIA_BASE_URL}"
            echo "Removing dist/audio from Pages artifact to speed deploy"
            rm -rf dist/audio
          else
            echo "PUBLIC_MEDIA_BASE_URL not set; keeping dist/audio in artifact"
          fi

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5

      - name: Notify Telegram on success/failure (optional)
        if: always()
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          RESULT: ${{ job.status }}
          PAGE_URL: ${{ steps.deployment.outputs.page_url }}
        run: |
          set -euo pipefail
          if [ -z "${TELEGRAM_BOT_TOKEN:-}" ] || [ -z "${TELEGRAM_CHAT_ID:-}" ]; then
            echo "Telegram secrets not set; skipping notify."
            exit 0
          fi

          if [ "${RESULT}" = "success" ]; then
            text="[OK] deploy-dev-pages succeeded: ${PAGE_URL}\n${RUN_URL}"
          else
            text="[ALERT] deploy-dev-pages ${RESULT}: ${RUN_URL}"
          fi

          curl -sS -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            -d "chat_id=${TELEGRAM_CHAT_ID}" \
            -d "text=${text}" \
            -d "disable_web_page_preview=true" >/dev/null
