name: deploy-dev-pages

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install deps
        run: npm ci

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      - name: Fetch Plausible pageview counts (optional)
        env:
          PLAUSIBLE_API_KEY: ${{ secrets.PLAUSIBLE_API_KEY }}
          PLAUSIBLE_SITE_ID: ${{ secrets.PLAUSIBLE_SITE_ID }}
          PLAUSIBLE_DATE_RANGE: 30d
        run: node scripts/fetch-plausible-pageviews.mjs

      - name: Lint content frontmatter
        run: npm run lint:content

      - name: Verify paper artifacts (PDF + generated HTML)
        run: npm run lint:papers

      - name: Verify memo artifacts (PDF + generated HTML)
        run: npm run lint:memos

      - name: Build (custom domain root)
        env:
          ASTRO_BASE: /
        run: npm run build

      - name: Regression test suite (smoke + overflow + a11y)
        run: |
          set -euo pipefail
          npm run preview -- --host 127.0.0.1 --port 4321 >/tmp/astro-preview.log 2>&1 &
          PREVIEW_PID=$!
          trap 'kill ${PREVIEW_PID} >/dev/null 2>&1 || true' EXIT

          for i in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:4321/ >/dev/null; then
              break
            fi
            sleep 1
          done

          SITE_BASE=http://127.0.0.1:4321 npx playwright test tests/smoke.spec.ts tests/overflow.spec.ts tests/a11y.spec.ts

      - name: Prepare linkcheck policy sets (strict/warn/ignore)
        run: npm run linkcheck:prepare

      - name: Link check (strict domains, blocking)
        uses: lycheeverse/lychee-action@v2
        with:
          lycheeVersion: v0.22.0
          args: >-
            --verbose
            --no-progress
            --accept 200,206,401,403,429
            --timeout 20
            --max-retries 2
            "tmp/linkcheck/strict-links.txt"

      - name: Link check (warn-only domains, non-blocking)
        if: always()
        run: npm run linkcheck:warn

      - name: Stale-link remediation suggestions
        if: always()
        run: npm run linkcheck:suggest

      - name: Upload linkcheck artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: deploy-linkcheck-artifacts
          path: tmp/linkcheck

      - name: Upload Playwright test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: deploy-playwright-results
          path: |
            test-results
            playwright-report

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

      - name: Notify Telegram on success/failure (optional)
        if: always()
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          RESULT: ${{ job.status }}
          PAGE_URL: ${{ steps.deployment.outputs.page_url }}
        run: |
          set -euo pipefail
          if [ -z "${TELEGRAM_BOT_TOKEN:-}" ] || [ -z "${TELEGRAM_CHAT_ID:-}" ]; then
            echo "Telegram secrets not set; skipping notify."
            exit 0
          fi

          if [ "${RESULT}" = "success" ]; then
            text="[OK] deploy-dev-pages succeeded: ${PAGE_URL}\n${RUN_URL}"
          else
            text="[ALERT] deploy-dev-pages ${RESULT}: ${RUN_URL}"
          fi

          curl -sS -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            -d "chat_id=${TELEGRAM_CHAT_ID}" \
            -d "text=${text}" \
            -d "disable_web_page_preview=true" >/dev/null
