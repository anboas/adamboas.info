<g class="box delivery"><rect x="1370" y="300" width="220" height="92" rx="0"/><line x1="1370" y1="300" x2="1370" y2="392" class="accent"/><g><text x="1386" y="326" class="box-title">Comptroller / Counsel / Ops</text><text x="1386" y="360" class="box-subtitle">Staff and governance</text></g></g>
