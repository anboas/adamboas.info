<g class="box delivery"><rect x="1200" y="760" width="260" height="104" rx="0"/><line x1="1200" y1="760" x2="1200" y2="864" class="accent"/><g><text x="1216" y="786" class="box-title">Test Wings / NAWCTSD</text><text x="1216" y="832" class="box-subtitle">Atlantic, Pacific, training</text><text x="1216" y="846" class="box-subtitle">systems</text></g></g>
<g class="box delivery"><rect x="1510" y="760" width="220" height="104" rx="0"/><line x1="1510" y1="760" x2="1510" y2="864" class="accent"/><g><text x="1526" y="786" class="box-title">FRC sites</text><text x="1526" y="832" class="box-subtitle">East, SE, SW, WP, West, NW,</text><text x="1526" y="846" class="box-subtitle">MA, Reserve</text></g></g>
