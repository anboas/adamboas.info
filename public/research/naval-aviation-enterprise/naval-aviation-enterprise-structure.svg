<g class="box delivery"><rect x="550" y="760" width="260" height="104" rx="0"/><line x1="550" y1="760" x2="550" y2="864" class="accent"/><g><text x="566" y="786" class="box-title">NAWCWD</text><text x="566" y="832" class="box-subtitle">China Lake / Point Mugu</text></g></g>
