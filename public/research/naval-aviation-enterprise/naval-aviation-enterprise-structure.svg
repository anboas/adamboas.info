<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1060" viewBox="0 0 1800 1060" role="img" aria-labelledby="title desc">
<title id="title">Naval Aviation Enterprise public structure</title>
<desc id="desc">NAVAIR command, named public leaders, competencies, PEOs, warfare centers, FRCs, OSBP, and fleet interfaces from public source anchors.</desc>
<style>
svg{background:#f8fafc;color:#0f172a;font-family:Arial,Helvetica,sans-serif}
.title{font-size:26px;font-weight:700;fill:#0f172a}
.subtitle{font-size:13px;fill:#475569}
.connector{fill:none;stroke:#475569;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round;marker-end:url(#arrow);opacity:.74}
.dashed{stroke-dasharray:7 7;opacity:.52}
.box rect{fill:#fff;stroke:#cbd5e1;stroke-width:1.4}
.box .accent{stroke:#64748b;stroke-width:5}
.authority rect{fill:#ecfeff}.authority .accent{stroke:#0891b2}
.command rect{fill:#f0fdfa}.command .accent{stroke:#0f766e}
.peo rect{fill:#eff6ff}.peo .accent{stroke:#2563eb}
.delivery rect{fill:#f8fafc}.delivery .accent{stroke:#475569}
.opportunity rect{fill:#fff7ed}.opportunity .accent{stroke:#ea580c}
.company rect{fill:#fef2f2}.company .accent{stroke:#dc2626}
.box-title{font-size:14px;font-weight:700;fill:#0f172a}
.box-subtitle{font-size:11px;fill:#475569}
.legend{font-size:12px;fill:#475569}
</style>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#475569"/></marker></defs>
<text x="28" y="38" class="title">Naval Aviation Enterprise public structure</text>
<text x="28" y="60" class="subtitle">NAVAIR command, named public leaders, competencies, PEOs, warfare centers, FRCs, OSBP, and fleet interfaces from public source anchors.</text>
<g class="box authority"><rect x="60" y="100" width="250" height="94" rx="0"/><line x1="60" y1="100" x2="60" y2="194" class="accent"/><g><text x="76" y="126" class="box-title">ASN (RD&amp;A)</text><text x="76" y="162" class="box-subtitle">Navy Acquisition Executive</text></g></g>
<g class="box authority"><rect x="350" y="100" width="250" height="94" rx="0"/><line x1="350" y1="100" x2="350" y2="194" class="accent"/><g><text x="366" y="126" class="box-title">CNO / CMC / ASN (FM&amp;C)</text><text x="366" y="162" class="box-subtitle">Operational and budget interfaces</text></g></g>
<g class="box command"><rect x="730" y="92" width="300" height="112" rx="0"/><line x1="730" y1="92" x2="730" y2="204" class="accent"/><g><text x="746" y="118" class="box-title">Naval Air Systems Command</text><text x="746" y="172" class="box-subtitle">VADM John E. Dougherty IV</text></g></g>
<g class="box authority"><rect x="1140" y="100" width="260" height="94" rx="0"/><line x1="1140" y1="100" x2="1140" y2="194" class="accent"/><g><text x="1156" y="126" class="box-title">Commander, Naval Air Forces</text><text x="1156" y="162" class="box-subtitle">Fleet readiness demand interface</text></g></g>
<g class="box opportunity"><rect x="1500" y="100" width="230" height="94" rx="0"/><line x1="1500" y1="100" x2="1500" y2="194" class="accent"/><g><text x="1516" y="126" class="box-title">Industry / OSBP / LRAF</text><text x="1516" y="162" class="box-subtitle">Vendor and forecast routes</text></g></g>
