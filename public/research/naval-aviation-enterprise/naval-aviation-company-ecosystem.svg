<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="980" viewBox="0 0 1800 980" role="img" aria-labelledby="title desc">
<title id="title">NAE incumbent and teaming ecosystem</title>
<desc id="desc">Twenty-five publicly named current incumbents from the NAWCAD FY26 Q3 LRAF grouped by capability seam.</desc>
<style>
svg{background:#f8fafc;color:#0f172a;font-family:Arial,Helvetica,sans-serif}
.title{font-size:26px;font-weight:700;fill:#0f172a}
.subtitle{font-size:13px;fill:#475569}
.connector{fill:none;stroke:#64748b;stroke-width:2;marker-end:url(#arrow)}
.dashed{stroke-dasharray:7 6}
.box rect{fill:#fff;stroke:#cbd5e1;stroke-width:1.4}
.box .accent{stroke:#64748b;stroke-width:5}
.authority rect{fill:#ecfeff}.authority .accent{stroke:#0891b2}
.command rect{fill:#f0fdfa}.command .accent{stroke:#0f766e}
.peo rect{fill:#eff6ff}.peo .accent{stroke:#2563eb}
.delivery rect{fill:#f8fafc}.delivery .accent{stroke:#475569}
.opportunity rect{fill:#fff7ed}.opportunity .accent{stroke:#ea580c}
.company rect{fill:#fef2f2}.company .accent{stroke:#dc2626}
.box-title{font-size:14px;font-weight:700;fill:#0f172a}
.box-subtitle{font-size:11px;fill:#475569}
.legend{font-size:12px;fill:#475569}
</style>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#64748b"/></marker></defs>
<text x="28" y="38" class="title">NAE incumbent and teaming ecosystem</text>
<text x="28" y="60" class="subtitle">Twenty-five publicly named current incumbents from the NAWCAD FY26 Q3 LRAF grouped by capability seam.</text>
<g class="box command"><rect x="70" y="120" width="280" height="112" rx="0"/><line x1="70" y1="120" x2="70" y2="232" class="accent"/><g><text x="86" y="146" class="box-title">Sabre-relevant lenses</text><text x="86" y="200" class="box-subtitle">Digital services, cyber, software,</text><text x="86" y="214" class="box-subtitle">mission systems, PM support</text></g></g>
<g class="box company"><rect x="500" y="80" width="280" height="104" rx="0"/><line x1="500" y1="80" x2="500" y2="184" class="accent"/><g><text x="516" y="106" class="box-title">C5I / C4I integrators</text><text x="516" y="152" class="box-subtitle">Smartronix, BAE, Render, FSG</text></g></g>
<g class="box company"><rect x="500" y="240" width="280" height="104" rx="0"/><line x1="500" y1="240" x2="500" y2="344" class="accent"/><g><text x="516" y="266" class="box-title">Software / enterprise systems</text><text x="516" y="312" class="box-subtitle">Spalding, Zenetex, PSI Pax, Perrygo,</text><text x="516" y="326" class="box-subtitle">DESI</text></g></g>
<g class="box company"><rect x="500" y="400" width="280" height="104" rx="0"/><line x1="500" y1="400" x2="500" y2="504" class="accent"/><g><text x="516" y="426" class="box-title">PMA / CSS support</text><text x="516" y="472" class="box-subtitle">Precise, StraCon, Tekla, ASEC</text></g></g>
<g class="box company"><rect x="500" y="560" width="280" height="104" rx="0"/><line x1="500" y1="560" x2="500" y2="664" class="accent"/><g><text x="516" y="586" class="box-title">Sustainment / training</text><text x="516" y="632" class="box-subtitle">Amentum, Avian, Sierra, Construction</text><text x="516" y="646" class="box-subtitle">Helicopters</text></g></g>
<g class="box company"><rect x="500" y="720" width="280" height="104" rx="0"/><line x1="500" y1="720" x2="500" y2="824" class="accent"/><g><text x="516" y="746" class="box-title">Cyber / M&amp;S / rapid engineering</text><text x="516" y="792" class="box-subtitle">RMC/MIL, AEA, SciTech, Altus, Amelex,</text><text x="516" y="806" class="box-subtitle">CRL, DCS</text></g></g>
