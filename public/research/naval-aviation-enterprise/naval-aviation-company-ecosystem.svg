<path d="M 350 176 C 425 176, 425 772, 500 772" class="connector dashed"/>
<g class="box opportunity"><rect x="1000" y="80" width="320" height="104" rx="0"/><line x1="1000" y1="80" x2="1000" y2="184" class="accent"/><g><text x="1016" y="106" class="box-title">Transition access</text><text x="1016" y="152" class="box-subtitle">Incumbent staff, runbooks, customer memory</text></g></g>
<g class="box opportunity"><rect x="1000" y="240" width="320" height="104" rx="0"/><line x1="1000" y1="240" x2="1000" y2="344" class="accent"/><g><text x="1016" y="266" class="box-title">Technical differentiation</text><text x="1016" y="312" class="box-subtitle">Cyber, software factory, C5I integration,</text><text x="1016" y="326" class="box-subtitle">T&amp;E data</text></g></g>
<g class="box opportunity"><rect x="1000" y="400" width="320" height="104" rx="0"/><line x1="1000" y1="400" x2="1000" y2="504" class="accent"/><g><text x="1016" y="426" class="box-title">Vehicle and procurement</text><text x="1016" y="472" class="box-subtitle">SeaPort, SA IDIQ, C-Type, set-aside</text><text x="1016" y="486" class="box-subtitle">posture</text></g></g>
<g class="box opportunity"><rect x="1000" y="560" width="320" height="104" rx="0"/><line x1="1000" y1="560" x2="1000" y2="664" class="accent"/><g><text x="1016" y="586" class="box-title">Economic model</text><text x="1016" y="632" class="box-subtitle">FFP/task order sizing by value band and</text><text x="1016" y="646" class="box-subtitle">labor mix</text></g></g>
<g class="box opportunity"><rect x="1000" y="720" width="320" height="104" rx="0"/><line x1="1000" y1="720" x2="1000" y2="824" class="accent"/><g><text x="1016" y="746" class="box-title">NAE mission claim</text><text x="1016" y="792" class="box-subtitle">Tie work to readiness, availability,</text><text x="1016" y="806" class="box-subtitle">aircrew and mission outcomes</text></g></g>
