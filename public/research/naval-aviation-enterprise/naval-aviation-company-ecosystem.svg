<g class="box authority"><rect x="1450" y="320" width="280" height="150" rx="0"/><line x1="1450" y1="320" x2="1450" y2="470" class="accent"/><g><text x="1466" y="346" class="box-title">Expanded evidence pass</text><text x="1466" y="438" class="box-subtitle">Leadership, OSBP routes, 43 LRAF</text><text x="1466" y="452" class="box-subtitle">rows, 25 incumbents, 14 sources.</text></g></g>
