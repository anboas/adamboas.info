      .tag-direct { fill: #e0f2fe; stroke: #7dd3fc; }
      .tag-corp { fill: #f1f5f9; stroke: #cbd5e1; }
      .tag-adjacent { fill: #fef3c7; stroke: #fbbf24; }
      .tag-gap { fill: #ffedd5; stroke: #fdba74; }
      .line { fill: none; stroke: #64748b; stroke-width: 2; marker-end: url(#arrow); }
      .line-soft { fill: none; stroke: #94a3b8; stroke-width: 1.5; stroke-dasharray: 6 5; marker-end: url(#arrow); }
      .line-direct { fill: none; stroke: #0284c7; stroke-width: 2.4; marker-end: url(#arrow); }
