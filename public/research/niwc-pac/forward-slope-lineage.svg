  <text class="body" x="95" y="248">Established 2002</text>
  <text class="body" x="95" y="270">San Diego mission software,</text>
  <text class="body" x="95" y="292">security, surveillance, and</text>
  <text class="body" x="95" y="314">professional services profile.</text>
