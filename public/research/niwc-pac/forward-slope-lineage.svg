  <rect class="page" width="1800" height="1120" />
  <text class="title" x="60" y="58">Forward Slope Lineage And NIWC Pacific / Application Arsenal Trail</text>
  <text class="subtitle" x="60" y="86">Public-source corporate lineage, contract-award evidence, named contact routes, and C2-adjacent capability context.</text>

