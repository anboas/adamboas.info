<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1120" viewBox="0 0 1800 1120" role="img" aria-labelledby="title desc">
  <title id="title">Forward Slope, Accelint, and Lyntris lineage connected to NIWC Pacific and Application Arsenal</title>
  <desc id="desc">Public-source lineage chart showing Forward Slope Inc. from 2002 establishment through Application Arsenal support awards, Accelint ownership, Lyntris combination, and NIWC Pacific C2-adjacent capability threads.</desc>
  <defs>
    <marker id="arrow" markerWidth="11" markerHeight="11" refX="9" refY="5.5" orient="auto">
      <path d="M0,0 L10,5.5 L0,11 Z" fill="#334155" />
    </marker>
    <style>
